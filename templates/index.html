<!DOCTYPE html>
<html>

<head>
    <title>Employee Prediction</title>
</head>

<body>

    <h1>Employee Attrition Prediction</h1>

    <form action="/predict" method="post">

        <label>Satisfaction Level:</label>
        <input type="text" name="satisfaction_level"><br><br>

        <label>Last Evaluation:</label>
        <input type="text" name="last_evaluation"><br><br>

        <label>Number of Projects:</label>
        <input type="text" name="number_project"><br><br>

        <label>Monthly Hours:</label>
        <input type="text" name="monthly_hours"><br><br>

        <label>Time Spend Company:</label>
        <input type="text" name="time_spend_company"><br><br>

        <label>Promotion Last 5 Years:</label>
        <input type="text" name="promotion_last_5years"><br><br>

        <label>Department:</label>
        <input type="text" name="department"><br><br>

        <label>Salary:</label>
        <input type="text" name="salary"><br><br>

        <button type="submit">Predict</button>

    </form>

</body>

</html>
